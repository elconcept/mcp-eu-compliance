# mcp-eu-compliance - offline korpus EUR-Lex (GDPR, AI Act, DORA, NIS2...) (stdio z repo -> supergateway, Streamable HTTP /mcp, port 8000). Stack Portainera "mcp-eu-compliance".
# Bez portu na hoscie. Dostep wylacznie: https://mcp-eu-compliance.xlap.pl/mcp - tunel cloudflared, bez Access (publiczny,
# bezstanowy - konektory claude.ai/ChatGPT). cf_mcp_eu_compliance: cloudflared + ten serwis, z wyjsciem do internetu.
# Przebudowa po pushu na main: deploy-hook (.github/workflows/deploy.yml).
services:
  mcp-eu-compliance:
    build:
      context: /volume2/docker/mcp-eu-compliance
      dockerfile: Dockerfile.nas
    image: mcp-eu-compliance:latest
    container_name: mcp-eu-compliance
    user: "1029:100"
    environment:
      - TZ=Europe/Warsaw
    networks:
      - cf_mcp_eu_compliance
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  cf_mcp_eu_compliance:
    external: true
